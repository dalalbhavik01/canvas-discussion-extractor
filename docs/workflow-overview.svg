<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc">
  <title id="title">Canvas Discussion Extraction: Simple Overview</title>
  <desc id="desc">The user selects cohorts; the host agent reads Canvas, captures all posts and replies, reconciles evidence, builds separate Excel files and verifies them before handoff. Unsafe actions stop. Recovery only restores local checkpoints.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#43515a"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #203037; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #58676e; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .box { fill: #fff; stroke: #b8c6cb; stroke-width: 2; }
      .safe { fill: #eef8f2; stroke: #39835b; stroke-width: 2; }
      .warn { fill: #fff2f1; stroke: #b54b48; stroke-width: 2; }
      .arrow { fill: none; stroke: #43515a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="860" fill="#f7f9fa"/>
  <text class="title" x="50" y="52">Canvas Discussion Extraction</text>
  <text class="sub" x="50" y="82">A portable agentic workflow: read, reconcile, export, verify.</text>
  <rect class="box" x="50" y="120" width="610" height="88" rx="8"/>
  <text class="label" x="76" y="151">1. Select the requested cohorts</text>
  <text class="body" x="76" y="179">\discussion + current URLs; one cohort or a selected subset.</text>
  <path class="arrow" d="M355 208 V235"/>
  <rect class="safe" x="50" y="235" width="610" height="88" rx="8"/>
  <text class="label" x="76" y="266">2. Read Canvas only</text>
  <text class="body" x="76" y="294">Verify identity, then expand, scroll and visit every page.</text>
  <path class="arrow" d="M355 323 V350"/>
  <rect class="box" x="50" y="350" width="610" height="88" rx="8"/>
  <text class="label" x="76" y="381">3. Capture every post and reply</text>
  <text class="body" x="76" y="409">Keep author IDs, parent relationships and source evidence.</text>
  <path class="arrow" d="M355 438 V465"/>
  <rect class="box" x="50" y="465" width="610" height="88" rx="8"/>
  <text class="label" x="76" y="496">4. Reconcile before exporting</text>
  <text class="body" x="76" y="524">Verify root coverage, all replies, identity and source stability.</text>
  <path class="arrow" d="M355 553 V580"/>
  <rect class="box" x="50" y="580" width="610" height="88" rx="8"/>
  <text class="label" x="76" y="611">5. Build one Excel workbook per cohort</text>
  <text class="body" x="76" y="639">Student Name | Discussion Post | Reply 1 | Reply 2 | Reply 3...</text>
  <path class="arrow" d="M355 668 V695"/>
  <rect class="safe" x="50" y="695" width="610" height="106" rx="8"/>
  <text class="label" x="76" y="726">6. Verify and hand over files</text>
  <text class="body" x="76" y="754">Compare saved cells; inspect layout and source spot-checks.</text>
  <text class="body" x="76" y="779">Report per-cohort totals and any unresolved limitations.</text>
  <rect class="safe" x="710" y="120" width="340" height="192" rx="8"/>
  <text class="label" x="734" y="154">Safety throughout</text>
  <text class="body" x="734" y="185">No edits, replies or grade changes.</text>
  <text class="body" x="734" y="214">No invented or truncated content.</text>
  <text class="body" x="734" y="243">No unrequested CoEqual upload.</text>
  <text class="body" x="734" y="281">Viewing may affect read markers.</text>
  <rect class="box" x="710" y="350" width="340" height="202" rx="8"/>
  <text class="label" x="734" y="384">Recovery by the host AI</text>
  <text class="body" x="734" y="415">Preserve evidence and checkpoints.</text>
  <text class="body" x="734" y="444">Retry safely; verify the result.</text>
  <text class="body" x="734" y="473">Resume verified local state only.</text>
  <text class="body" x="734" y="511">No automatic provider switching.</text>
  <rect class="warn" x="710" y="590" width="340" height="211" rx="8"/>
  <text class="label" x="734" y="624">Stop when evidence fails</text>
  <text class="body" x="734" y="655">Ambiguous action: stop and disclose.</text>
  <text class="body" x="734" y="684">Missing source: ask, do not guess.</text>
  <text class="body" x="734" y="713">Blocked cohort: report partial work.</text>
  <text class="body" x="734" y="751">Never undo Canvas automatically.</text>
  <text class="body" x="734" y="779">Never label incomplete work complete.</text>
  <text class="sub" x="50" y="839">The agent operates the browser; local scripts validate data and saved workbook content.</text>
</svg>
